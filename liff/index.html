<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>คลัง Vorda — เลือกเมนู</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="top-bar">
    <span></span>
    <button class="link" type="button" onclick="__showMyId && __showMyId()">ID ของฉัน →</button>
  </div>
  <div class="card">
    <img class="logo" src="./img/logo.jpg" alt="VORDA SKINCARE" />
    <div class="brand">บริษัท วอร์ด้า สกินแคร์ จำกัด</div>
    <h1>ระบบคลังสินค้า</h1>
    <div class="subtitle">เลือกเมนูที่ต้องการ</div>

    <div id="error" class="error" style="display:none"></div>

    <div class="menu-grid">
      <a class="menu-btn" href="./inbound.html">
        <div class="menu-icon">+</div>
        <div>รับเข้า</div>
        <div class="menu-sub">จากโรงงาน</div>
      </a>
      <a class="menu-btn" href="./outbound.html">
        <div class="menu-icon">−</div>
        <div>หยิบออก</div>
        <div class="menu-sub">ไปแพคส่ง</div>
      </a>
      <a class="menu-btn" href="./count.html">
        <div class="menu-icon">=</div>
        <div>นับเทียบ</div>
        <div class="menu-sub">สัปดาห์ละครั้ง</div>
      </a>
      <a class="menu-btn" href="./adjust.html">
        <div class="menu-icon">×</div>
        <div>ตัดสต๊อก</div>
        <div class="menu-sub">ของเสีย/แตก</div>
      </a>
      <a class="menu-btn" href="./return.html">
        <div class="menu-icon">↩</div>
        <div>ตีคืน</div>
        <div class="menu-sub">มีถ่าย VDO</div>
      </a>
      <a class="menu-btn" href="./cancel.html">
        <div class="menu-icon">⌀</div>
        <div>ยกเลิก</div>
        <div class="menu-sub">ของไม่ถึง</div>
      </a>
    </div>

    <a id="owner-btn" class="menu-btn owner-only" href="./owner.html" style="display:none">
      <div class="menu-icon">★</div>
      <div>เมนูเจ้าของ</div>
      <div class="menu-sub">approve + ปรับยอด + รายงาน</div>
    </a>
  </div>

  <div class="page-footer">บริษัท วอร์ด้า สกินแคร์ จำกัด</div>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script type="module">
    import { CONFIG } from './js/config.js';
    import { state } from './js/auth.js';
    import { ensureRegistered } from './js/guard.js';
    import { api } from './js/api.js';

    const errEl = document.getElementById('error');
    const ownerBtn = document.getElementById('owner-btn');

    function showError(msg) {
      errEl.textContent = msg;
      errEl.style.display = 'block';
    }

    async function init() {
      try {
        await ensureRegistered(CONFIG.LIFF_ID_INBOUND);
        // ถ้า myStatus ว่ามี is_owner → แสดงปุ่ม owner
        if (state.myStatus && state.myStatus.is_owner) {
          ownerBtn.style.display = 'flex';
        }
      } catch (err) {
        if (String(err.message || '').indexOf('redirecting') === 0) return;
        showError('เปิดระบบไม่ได้: ' + (err && err.message ? err.message : err));
      }
    }
    init();
  </script>
</body>
</html>
