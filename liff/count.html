<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>นับเทียบ — คลัง Vorda</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="top-bar">
    <a href="./index.html">← เมนู</a>
    <button class="link" type="button" onclick="__showMyId && __showMyId()">ID ของฉัน</button>
  </div>
  <div class="card">
    <img class="logo" src="./img/logo.jpg" alt="VORDA SKINCARE" />
    <div class="brand">บริษัท วอร์ด้า สกินแคร์ จำกัด</div>
    <h1>นับเทียบสัปดาห์</h1>
    <div class="subtitle">double-blind 2 คน — ยอด 0 ก็ได้</div>

    <div id="error" class="error" style="display:none"></div>

    <div id="form-section">
      <div class="round-toggle">
        <button id="round-r1" class="active" type="button">รอบที่ 1</button>
        <button id="round-r2" type="button">รอบที่ 2</button>
      </div>

      <div id="r1-section"></div>

      <div id="r2-section" style="display:none">
        <div class="warning-block">
          <strong>รอบ 2:</strong> ใส่เลขใบที่คนนับ 1 บอก แล้วกรอก qty ของคุณเอง
        </div>
        <div class="field">
          <div class="label">เลขใบจากรอบ 1</div>
          <input id="r2-pairing" type="text" placeholder="CNT-YYYYMMDD-XXXX" />
        </div>
      </div>

      <div class="field">
        <div class="label">สินค้า</div>
        <select id="product-select"><option>กำลังโหลด...</option></select>
      </div>

      <div class="field">
        <div class="label">ยอดนับจริง (ชิ้น) — ใส่ 0 ได้ถ้าหมด</div>
        <input id="qty-input" type="number" inputmode="numeric" min="0" placeholder="0" />
      </div>

      <div class="label">ถ่ายรูป 4 มุม</div>
      <div class="camera-wrap">
        <video id="camera-video" autoplay playsinline muted></video>
      </div>
      <div id="photo-grid" class="photo-grid">
        <div class="photo-slot">มุม 1</div>
        <div class="photo-slot">มุม 2</div>
        <div class="photo-slot">มุม 3</div>
        <div class="photo-slot">มุม 4</div>
      </div>
      <div id="photo-counter" class="photo-counter">ถ่ายแล้ว 0 / 4</div>
      <div class="row">
        <button id="capture-btn" class="btn-primary" type="button">ถ่าย มุม 1</button>
        <button id="retake-btn" class="btn-secondary" type="button">ลบ + ถ่ายใหม่</button>
      </div>

      <button id="submit-btn" class="btn-primary" type="button" style="margin-top:14px">บันทึก</button>
    </div>

    <div id="after-submit" style="display:none">
      <div id="result-banner" class="success-banner"></div>

      <div class="mov-id-box">
        <div class="label-small">เลขใบ</div>
        <div id="result-id-text" class="id-text"></div>
      </div>
      <button id="copy-id-btn" class="btn-primary" type="button">คัดลอกเลข CNT</button>

      <div id="undo-bar" class="undo-bar" style="display:none">
        <div id="undo-text"></div>
        <button id="undo-btn" type="button">ยกเลิกการบันทึก</button>
      </div>

      <button id="new-btn" class="btn-secondary" type="button" style="margin-top:12px">บันทึกรายการใหม่</button>
    </div>
  </div>

  <div class="page-footer">บริษัท วอร์ด้า สกินแคร์ จำกัด</div>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script type="module">
    import { initMovementForm } from './js/movementForm.js';
    import { CONFIG } from './js/config.js';
    initMovementForm({
      liffId: CONFIG.LIFF_ID_COUNT,
      action: 'submitCount',
      pairingKey: 'pairingCountId',
      resultIdKey: 'countId',
      cancelRecordType: 'count',
      idPrefix: 'CNT-',
      hasReason: false,
      allowZeroQty: true,
    });
  </script>
</body>
</html>
